server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: the browser only ever talks to this server; nginx forwards /api to the API container.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback: client-side routes (/product/1, /category/x) all serve index.html.
  location / {
    try_files $uri /index.html;
  }
}
