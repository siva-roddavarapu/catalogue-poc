services:
  mailpit:
    # Local SMTP server + web inbox: http://localhost:8025 is the "sales inbox" for AC5.
    image: axllent/mailpit:v1.34
    ports:
      - '8025:8025'
      - '1025:1025'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      # Inside the compose network the API reaches Mailpit by service name.
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      PORT: '3000'
    ports:
      - '3000:3000'
    depends_on:
      - mailpit
    healthcheck:
      # 127.0.0.1, not localhost: alpine may resolve localhost to ::1 while the API listens on IPv4.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy
